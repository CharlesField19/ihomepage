server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    absolute_redirect off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # The page itself must always be revalidated so a new app.js is picked up.
    location = /index.html {
        expires -1;
    }

    # Catalogs and the icon map change with a release, but tolerate short caching.
    location ~ ^/(catalog(-zh)?|icon-map)\.json$ {
        expires 5m;
        try_files $uri =404;
    }

    location /icons/ {
        expires 30d;
        try_files $uri =404;
    }

    location /banners/ {
        expires 7d;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
